<!doctype html>
<html lang="es" data-base="noche" data-accent="azul">
<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- Anti-FOUC: apply saved theme before first paint -->
	<script>
		try {
			var b = localStorage.getItem('meado-base');
			var a = localStorage.getItem('meado-accent');
			// Migrate from old single-axis theme
			var old = localStorage.getItem('meado-theme');
			if (old && !b) {
				b = (old === 'light') ? 'dia' : 'noche';
				a = (old === 'purple') ? 'morado' : 'azul';
			}
			if (b) document.documentElement.setAttribute('data-base', b);
			if (a) document.documentElement.setAttribute('data-accent', a);
		} catch(e) {}
	</script>

	<!-- Nunito UI font -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
	<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

	<script async src="https://www.googletagmanager.com/gtag/js?id=G-0X84Z9PQ55"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());
		gtag('config', 'G-0X84Z9PQ55');
	</script>
	%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
